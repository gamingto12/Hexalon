#
# Hexalon Configuration
#
# Any and all formats will use Adventure's MiniMessage text formatting system. For more information and to test out MiniMessage formatted text,
#   visit https://webui.advntr.dev/
#

# The main configuration for the bot
# discord.token = The bot's token, you can make a bot @ https://discord.com/developers/applications
# discord.format = The format for messages sent to the Minecraft server; supports <role>, <author>, and <message>
# discord.activity = The bot's status
# discord.guild-id = The ID to the server where the bot is located
# discord.channels = The channel IDs for the bot to send messages to
# discord.adminRoleIds = The list of role IDs to use the AdminConsole command
# discord.console = Enable/Disable console forwarding
# discord.chat-role-ignore-list = Discord role names or IDs to omit from the Minecraft chat format
# discord.invite = Your server invite link
discord:
  token: ""
  format: "<dark_gray>[<dark_aqua>Discord</dark_aqua>] [<role>] <red><author> <dark_gray>» <white><message>"
  chat-role-ignore-list: ["Don't show me", "Misc role"]
  activity: "koolfreedom.eu.org"
  guild-id: ""
  channels:
    chat-id: ""
    # Optional: Channel ID for server console logging
    console-id: ""
  adminRoleIds:
    - ""
  console:
    enabled: false
    disallowed-commands: ["op", "deop", "?", "execute"]
  invite:

# The address to your server, this is used to send an embed when someone asks "what is the ip"
server:
  address: 127.0.0.1

updater:
  jar-url: "https://gamingto12.me/hexalon.jar"